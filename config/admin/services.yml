# TWO-26082: `file` as there is no Composer autoloader; the tag description spares Symfony 6 reflecting the class.
services:
  twopayment.command.shipping_tax_fallback:
    class: TwoShippingTaxFallbackCommand
    file: '%kernel.project_dir%/modules/twopayment/classes/TwoShippingTaxFallbackCommand.php'
    public: true
    tags:
      - { name: console.command, command: 'twopayment:shipping-tax-fallback', description: 'Enable, disable or show the Two Default shipping tax code fallback for this shop.' }
