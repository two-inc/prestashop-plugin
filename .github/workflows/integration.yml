name: Integration (real PrestaShop engine)

# TWO-25217. The offline suite (tests/run.php) stubs PrestaShop core, so it can
# only prove the module's logic is right about a cart shape the stub asserts
# into existence. These probes ask a REAL engine for the payload of a real cart
# and check what comes back, closing exactly that gap — see
# tests/integration/README.md.
#
# Still hermetic, like every other job in this repo: no secrets, no live Two
# API, no browser. Reuses the same dev/ci/*.sh harness as smoke.yml and e2e.yml.
#
# Legs (TWO-27173): the probes run on the same discovered PrestaShop x PHP
# matrix as e2e.yml (see its header and dev/support-matrix.sh). The
# carrier-less shipping matrix runs on the smoke legs: the newest release of
# each PrestaShop minor on the newest PHP it declares. It reports cart shapes
# that PrestaShop core computes, which vary by PrestaShop release and not by
# PHP minor, and the probes already run every PHP minor.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # e2e.yml annotates the skipped and non-blocking combinations; this run
  # only writes its step summary, so each gets one warning, not two.
  discover:
    name: Discover
    uses: ./.github/workflows/support-matrix.yml
    with:
      scope: all
      table: e2e
      annotate: false

  integration:
    name: Integration probes (PrestaShop ${{ matrix.combo.ps }}, PHP ${{ matrix.combo.php }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.combo.provisional }}
    strategy:
      fail-fast: false
      matrix:
        combo: ${{ fromJSON(needs.discover.outputs.matrix).e2e }}
    env:
      SFX: integration-${{ matrix.combo.ps }}-${{ matrix.combo.php }}-${{ github.run_id }}
      PS_IMAGE: ${{ matrix.combo.image }}
      # The probes never call Two — but the module primes checkout media on
      # some paths, so point that at a port nothing listens on so it fails
      # fast instead of reaching Two's real sandbox from public CI.
      TWO_API_BASE_URL: "http://127.0.0.1:1"
    steps:
      - uses: actions/checkout@v4

      - name: Boot PrestaShop
        run: dev/ci/boot-prestashop.sh

      # Behind php.net's newest patch: a warning, never a failure.
      - name: PHP is the latest patch
        run: |
          running=$(docker exec "ps-$SFX" php -r 'echo PHP_VERSION;')
          dev/ci/check-php-patch.sh "$PS_IMAGE" "$running"

      - name: Stage HEAD module source
        run: |
          set -o pipefail
          mkdir -p /tmp/head-module
          git ls-files -z | tar --null -cf - -T - | tar -xf - -C /tmp/head-module

      - name: Install module from HEAD
        run: dev/ci/install-module.sh /tmp/head-module

      - name: Seed Two config (hermetic — no live merchant key)
        run: dev/ci/seed-two-config.sh

      - name: Seed the carrier-less shipping cart
        run: dev/ci/seed-carrierless-cart.sh

      - name: Install the order postprocessing subscriber fixture
        run: dev/ci/install-order-postprocessing-fixture.sh

      - name: Run integration probes
        run: dev/ci/run-integration-probes.sh

      - name: Dump module log on failure
        if: failure()
        run: |
          docker exec -u www-data "ps-$SFX" php -d memory_limit=512M -r '
            require "/var/www/html/config/config.inc.php";
            $logs = new PrestaShopCollection("PrestaShopLogger");
            $logs->where("message", "like", "%TwoPayment%");
            foreach ($logs as $log) {
              echo "[" . (int) $log->severity . "] " . $log->message . PHP_EOL;
            }
          ' || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f "ps-$SFX" "psdb-$SFX" 2>/dev/null || true
          docker network rm "psnet-$SFX" 2>/dev/null || true

  carrierless-matrix:
    name: Carrier-less shipping matrix (PrestaShop ${{ matrix.combo.ps }}, PHP ${{ matrix.combo.php }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        combo: ${{ fromJSON(needs.discover.outputs.matrix).smoke }}
    env:
      PS_IMAGE: ${{ matrix.combo.image }}
    steps:
      - uses: actions/checkout@v4

      # Report-only: boots and removes its own shop, and fails only if a cell cannot reproduce its cart shape.
      - name: Carrier-less shipping matrix
        run: dev/ci/run-carrierless-matrix.sh
