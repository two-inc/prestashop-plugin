name: Integration (real PrestaShop engine)

# TWO-25217. The offline suite (tests/run.php) stubs PrestaShop core, so it can
# only prove the module's logic is right about a cart shape the stub asserts
# into existence. These probes ask a REAL engine for the payload of a real cart
# and check what comes back, closing exactly that gap — see
# tests/integration/README.md.
#
# Still hermetic, like every other job in this repo: no secrets, no live Two
# API, no browser. Reuses the same dev/ci/*.sh harness as smoke.yml and e2e.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration probes (PS ${{ matrix.ps-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Same matrix as e2e.yml (see its header for the 1.7.6 leg).
        include:
          - ps-version: "1.7.6"
            image: prestashop/prestashop:1.7.6.5-7.2-apache
          - ps-version: "8"
            image: prestashop/prestashop:8-apache
          - ps-version: "9"
            # TWO-26105: pinned, as 9-apache from 2026-09-30 exits after install; unpin once upstream's entrypoint tolerates a missing install/.
            image: prestashop/prestashop:9-apache@sha256:8e1d3596c5b2b8c4385ac1506a3978f7ae6ff15bf73649713458691308bd2fcc
    env:
      SFX: integration-${{ matrix.ps-version }}-${{ github.run_id }}
      PS_IMAGE: ${{ matrix.image }}
      # The probes never call Two — but the module primes checkout media on
      # some paths, so point that at a port nothing listens on so it fails
      # fast instead of reaching Two's real sandbox from public CI.
      TWO_API_BASE_URL: "http://127.0.0.1:1"
    steps:
      - uses: actions/checkout@v4

      - name: Boot PrestaShop
        run: dev/ci/boot-prestashop.sh

      - name: Stage HEAD module source
        run: |
          set -o pipefail
          mkdir -p /tmp/head-module
          git ls-files -z | tar --null -cf - -T - | tar -xf - -C /tmp/head-module

      - name: Install module from HEAD
        run: dev/ci/install-module.sh /tmp/head-module

      - name: Seed Two config (hermetic — no live merchant key)
        run: dev/ci/seed-two-config.sh

      - name: Seed the carrier-less shipping cart
        run: dev/ci/seed-carrierless-cart.sh

      - name: Run integration probes
        run: dev/ci/run-integration-probes.sh

      - name: Dump module log on failure
        if: failure()
        run: |
          docker exec -u www-data "ps-$SFX" php -d memory_limit=512M -r '
            require "/var/www/html/config/config.inc.php";
            $logs = new PrestaShopCollection("PrestaShopLogger");
            $logs->where("message", "like", "%TwoPayment%");
            foreach ($logs as $log) {
              echo "[" . (int) $log->severity . "] " . $log->message . PHP_EOL;
            }
          ' || true

      # The Apache error log is the container's stderr in these images.
      - name: Dump Apache and PrestaShop logs on failure
        if: failure()
        run: |
          docker logs --tail 300 "ps-$SFX" 2>&1 || true
          docker exec "ps-$SFX" bash -c 'for f in /var/www/html/var/logs/*.log; do echo "== $f"; tail -n 200 "$f"; done' || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f "ps-$SFX" "psdb-$SFX" 2>/dev/null || true
          docker network rm "psnet-$SFX" 2>/dev/null || true

  carrierless-matrix:
    name: Carrier-less shipping matrix (PS ${{ matrix.ps-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - ps-version: "8"
            image: prestashop/prestashop:8-apache
          - ps-version: "9"
            # TWO-26105: pinned, as 9-apache from 2026-09-30 exits after install; unpin once upstream's entrypoint tolerates a missing install/.
            image: prestashop/prestashop:9-apache@sha256:8e1d3596c5b2b8c4385ac1506a3978f7ae6ff15bf73649713458691308bd2fcc
    env:
      PS_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      # Report-only: boots and removes its own shop, and fails only if a cell cannot reproduce its cart shape.
      - name: Carrier-less shipping matrix
        run: dev/ci/run-carrierless-matrix.sh
