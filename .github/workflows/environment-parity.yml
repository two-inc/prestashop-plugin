name: Environment parity

# dev/environment-parity.php (TWO-26613) checks that this plugin and its
# siblings offer the same Environment setting. It regenerates this repo's
# dev/environment-contract.json from its own code, fails if the committed
# copy differs, and compares it with the siblings' copies, read with gh api
# as data: a PR at its branch name when a sibling has one, else staging; a
# push or the nightly run at the branch it runs on. The nightly run compares
# staging with the siblings' staging, catching a merge on one repo with no
# sibling. No secrets: the siblings are public.
on:
  pull_request:
  push:
    branches: [staging, main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: environment-parity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment-parity:
    name: Environment parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # A tool run, not a version check: the newest PHP php.net supports
      # (dev/support-matrix.sh, TWO-27173), so it never sits on a minor that
      # has gone end of life.
      - name: Newest supported PHP
        id: php
        run: |
          set -euo pipefail
          newest=$(bash dev/support-matrix.sh --php | jq -r .php_newest)
          echo "newest=$newest" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php.outputs.newest }}
          coverage: none
          tools: none
      - env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT_PARITY_SIBLING_REF: ${{ github.head_ref || github.ref_name }}
        run: php dev/environment-parity.php
