name: Module Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Syntax check test files
        run: |
          php -l twopayment.php
          php -l controllers/front/payment.php
          php -l controllers/front/invoice.php
          php -l controllers/admin/AdminTwopaymentInvoiceController.php
          php -l classes/TwoInvoiceRetrievalService.php
          php -l classes/TwoCheckoutAmountException.php
          php -l tests/bootstrap.php
          php -l tests/TwoInvoiceRetrievalSpec.php
          php -l tests/CustomerAddressFormatterOverrideSpec.php
          php -l tests/TrackingNumberSpec.php
          php -l tests/DefaultPaymentTermSpec.php
          php -l tests/MinimumOrderGateSpec.php
          php -l tests/FxRatesSpec.php
          php -l tests/AjaxCheckoutFailureSpec.php
          php -l tests/CheckoutLatencySpec.php
          php -l tests/ShippingCostSourcingSpec.php
          php -l tests/DefaultShippingTaxCodeSpec.php
          php -l tests/FulfilledStatusMappingSpec.php
          php -l tests/AddressLookupConfigSpec.php
          php -l tests/IntentApprovedNoticeSpec.php
          php -l tests/DeployVersionInfoSpec.php
          php -l tests/run.php
          # Integration probes + their harness. They only run inside a
          # PrestaShop container (.github/workflows/integration.yml), so this
          # is where a syntax error in them gets caught cheaply.
          php -l tests/integration/default-shipping-tax-code.php
          php -l tests/integration/fixtures/twocarrierlesstest/twocarrierlesstest.php
          php -l dev/ci/seed-carrierless-cart.php

      - name: Run offline test suite
        run: php tests/run.php

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Download phpstan (pinned + checksum-verified)
        env:
          PHPSTAN_VERSION: "2.2.5"
          PHPSTAN_SHA256: "1b2f03384ebcfd67053b06b69cbc0b9f62bf239349f69eaf723649409789e2e6"
        run: |
          curl -sL -o /tmp/phpstan.phar "https://github.com/phpstan/phpstan/releases/download/${PHPSTAN_VERSION}/phpstan.phar"
          echo "${PHPSTAN_SHA256}  /tmp/phpstan.phar" | sha256sum -c -

      # Real stub discovery (TWO-25107): phpstan resolves PrestaShop core
      # classes from an actual core checkout instead of blanket
      # class.notFound baseline ignores. Pinned to the module's minimum
      # supported version (ps_versions_compliancy min in twopayment.php) so
      # signatures are checked against the strictest floor the module
      # claims to support. Sparse + blob-filtered: only the dirs
      # scanDirectories in phpstan.neon needs (~9 MB, a few seconds).
      - name: Fetch PrestaShop core sources (pinned)
        env:
          PS_CORE_TAG: "1.7.6.0"
        run: |
          git clone --depth 1 --branch "$PS_CORE_TAG" --filter=blob:none --sparse \
            https://github.com/PrestaShop/PrestaShop.git /tmp/prestashop-core
          git -C /tmp/prestashop-core sparse-checkout set classes config src/Core/Payment

      # PrestaShop generates `class X extends XCore {}` aliases at runtime
      # (PrestaShopAutoload); mirror them statically so phpstan can resolve
      # the plain class names the module uses.
      - name: Generate core class aliases
        run: php dev/ci/generate-ps-class-aliases.php /tmp/prestashop-core /tmp/prestashop-class-aliases.php

      - name: Run phpstan
        run: php /tmp/phpstan.phar analyse --configuration=phpstan.neon --no-progress --memory-limit=1G
